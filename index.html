<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nithin Aruswamy — Studio</title>
  <meta name="description" content="Design can save the world. Private Garden, coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..800&family=IBM+Plex+Mono&family=Silkscreen&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Story+Script&family=Style+Script&family=Workbench&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="intro-on">
  <div class="grain" aria-hidden="true"></div>

  <!-- intro: reel -> card -> flicker -> ruler lines -> name -->
  <section id="intro" aria-hidden="true">
    <button id="enter" class="gate">enter<span>sound on</span></button>
    <div id="stage" class="stage">
      <video id="reel" playsinline preload="auto"></video>
      <div id="placeholder" class="placeholder"></div>
      <div id="flicker" class="flicker"></div>
    </div>
    <svg id="fgrid" class="fgrid" preserveAspectRatio="none" aria-hidden="true"></svg>
    <p id="count" class="count"></p>
    <p id="sub" class="sub"></p>
    <svg id="guides" class="guides"></svg>
    <button id="skip" class="skip">skip</button>
  </section>

  <!-- the name as a title card: written large at the end of the intro, then it lifts away -->
  <div id="name" class="name" aria-hidden="true"></div>

  <main id="site">
    <!-- one quiet row of facts; the fountain is the only large thing -->
    <header class="strip">
      <h1 class="who">Nithin Aruswamy</h1>
      <p class="what"><b>Private Garden</b><span>coming soon</span></p>
      <p class="mail"><span id="email"></span><button id="copy">Copy</button></p>
      <a class="go" href="https://travel.nithinaruswamy.com">Travel <span aria-hidden="true">→</span></a>
    </header>

    <div class="garden">
      <svg id="fountain" viewBox="24 50 352 330" preserveAspectRatio="xMidYMax meet" role="img" aria-label="A fountain, drawn by hand. Put your cursor in the water."></svg>
    </div>

    <p class="belief">Design can save the world.</p>

    <a class="replay" href="?intro">Replay intro</a>
  </main>

  <!-- work: scroll-driven stack that bursts into a field. see work.js -->
  <section id="work" class="work" aria-label="Work">
    <div class="work-rails" aria-hidden="true"></div>
    <div class="work-stage">
      <div class="work-space"></div>
      <p class="work-word"></p>
      <p class="work-word"></p>
    </div>
  </section>

  <script src="config.js"></script>
  <script src="fountain.js"></script>
  <script src="main.js"></script>
  <script src="work.js"></script>
</body>
</html>
