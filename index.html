  <meta charset="utf-8">

  <meta property="og:video:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Private Garden">

  <meta name="twitter:image" content="https://studio.nithinaruswamy.com/assets/og.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..800&family=IBM+Plex+Mono&family=Silkscreen&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Story+Script&family=Style+Script&family=Workbench&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=erode@400,500,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1117121528">
  <noscript><style>#intro { display: none; } body { overflow: auto !important; } .under, .garden, .foot { opacity: 1 !important; }</style></noscript>
</head>
<body class="intro-on">
  <div class="grain" aria-hidden="true"></div>
  <div class="grain lite" aria-hidden="true"></div>

  <!-- intro: film -> card -> flicker -> ruler lines -> name -->
  <section id="intro" aria-hidden="true">
    <div id="stage" class="stage">
      <video id="reel" playsinline preload="auto"></video>
      <div id="placeholder" class="placeholder"></div>
      <div id="flicker" class="flicker"></div>
    </div>
    <svg id="fgrid" class="fgrid" preserveAspectRatio="none" aria-hidden="true"></svg>
    <p id="count" class="count"></p>
    <p id="cap" class="cap"></p>
    <svg id="guides" class="guides"></svg>
    <button id="skip" class="skip">skip</button>
    <!-- follows the cursor while the film plays; a click switches the sound -->
    <div id="tag" class="tag" aria-hidden="true"><span>Audio on</span></div>
  </section>

  <main id="site">
    <!-- written large in the middle at the end of the intro, then it moves up and sits half cut at the top -->
    <h1 id="name" class="name card" aria-label="Private Garden"><noscript>Private Garden</noscript></h1>

    <p class="under"><span class="by">A Collective by <a id="by" class="hl-me" target="_blank" rel="noopener">Nithin Aruswamy</a></span></p>

    <div class="garden">
      <svg id="fountain" viewBox="12 50 376 334" preserveAspectRatio="xMidYMax meet" role="img" aria-label="A fountain, drawn by hand. Put your cursor in the water."></svg>
    </div>

    <blockquote class="quote"><p id="quote" class="hl-me"></p><cite id="quote-by"></cite></blockquote>

    <!-- three short lines and a way out, on the right -->
    <div class="bio">
      <p id="bio"></p>
      <a class="btn" id="about"><span class="hl-me">About</span><span aria-hidden="true">→</span></a>
    </div>

    <a class="foot replay" href="?intro">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8.6 8.4a.9.9 0 0 0-.9-.9 1.8 1.8 0 0 0-1.8 1.8 2.9 2.9 0 0 0 2.9 2.9 4.7 4.7 0 0 0 4.7-4.7A6.1 6.1 0 0 0 7.4 1.4 6.6 6.6 0 0 0 2 4.2M2 1.6v2.8h2.8"/></svg>
      Replay intro
    </a>
    <a class="foot x" id="x" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.4 2.5h2.9l8.3 11h-2.9zM13 2.5 8.8 7.2M7 9.2l-4.2 4.3"/></svg>
      <span id="x-handle"></span>
    </a>
  </main>

  <!-- work: scroll-driven stack that bursts into a field. see work.js -->
  <section id="work" class="work" aria-label="Work">
    <div class="work-rails" aria-hidden="true"></div>
    <div class="work-stage">
      <div class="work-space"></div>
      <p class="work-word"></p>
      <p class="work-word"></p>
    </div>
  </section>

  <!-- footer: two words pressed into the page with a fountain between them -->
  <footer class="end" id="end">
    <p class="end-big" id="end-big" aria-label="Coming soon">
      <span class="end-line" id="end-line" aria-hidden="true">
        <span class="w">Coming</span>
        <svg class="end-icon" viewBox="0 0 100 100">
          <path d="M2 79h96v6H2zM7 85h86l-4 15H11zM45 79l2-22h6l2 22zM21 50h58q-8 11-29 11t-29-11zM47.5 50l1-15h3l1 15zM34 31h32q-6 8-16 8t-16-8zM50 20.4a3.6 3.6 0 1 0 .01 0z"/>
          <path class="jet" d="M50 19C44 5 33 12 35 27M50 19c6-14 17-7 15 8M35 34c-10 1-12 8-11 13M65 34c10 1 12 8 11 13M23 55c-12 2-14 14-13 21M77 55c12 2 14 14 13 21"/>
        </svg>
        <span class="w">Soon</span>
      </span>
    </p>
  </footer>

  <script src="config.js?v=1117121528"></script>
  <script src="fountain.js?v=1117121528"></script>
  <script src="main.js?v=1117121528"></script>
  <script src="work.js?v=1117121528"></script>
</body>
</html>
