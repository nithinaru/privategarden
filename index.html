<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nithin Aruswamy — Studio</title>
  <meta name="description" content="Design can save the world. Private Garden, coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..800&family=IBM+Plex+Mono&family=Silkscreen&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Story+Script&family=Style+Script&family=Workbench&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="intro-on">
  <div class="grain" aria-hidden="true"></div>

  <!-- intro: reel -> card -> flicker -> ruler lines -> name -->
  <section id="intro" aria-hidden="true">
    <button id="enter" class="gate">enter<span>sound on</span></button>
    <div id="stage" class="stage">
      <video id="reel" playsinline preload="auto"></video>
      <div id="placeholder" class="placeholder"></div>
      <div id="flicker" class="flicker"></div>
    </div>
    <svg id="fgrid" class="fgrid" preserveAspectRatio="none" aria-hidden="true"></svg>
    <p id="count" class="count"></p>
    <p id="cap" class="cap"></p>
    <p id="sub" class="sub"></p>
    <svg id="guides" class="guides"></svg>
    <button id="skip" class="skip">skip</button>
  </section>

  <main id="site">
    <!-- written large in the middle at the end of the intro, then it moves up and sits half cut at the top -->
    <h1 id="name" class="name card" aria-label="Private Garden"></h1>

    <p class="under"><span class="by">A Collective by <b>Nithin Aruswamy</b></span></p>

    <div class="garden">
      <svg id="fountain" viewBox="24 50 352 330" preserveAspectRatio="xMidYMax meet" role="img" aria-label="A fountain, drawn by hand. Put your cursor in the water."></svg>
    </div>

    <blockquote class="quote"><p id="quote"></p><cite id="quote-by"></cite></blockquote>

    <!-- three short lines and a way out, on the right -->
    <div class="bio">
      <p id="bio"></p>
      <a class="btn" id="about"><span class="hl-me">About</span><span aria-hidden="true">→</span></a>
    </div>

    <a class="foot replay" href="?intro">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8.6 8.4a.9.9 0 0 0-.9-.9 1.8 1.8 0 0 0-1.8 1.8 2.9 2.9 0 0 0 2.9 2.9 4.7 4.7 0 0 0 4.7-4.7A6.1 6.1 0 0 0 7.4 1.4 6.6 6.6 0 0 0 2 4.2M2 1.6v2.8h2.8"/></svg>
      Replay intro
    </a>
    <a class="foot x" id="x" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.4 2.5h2.9l8.3 11h-2.9zM13 2.5 8.8 7.2M7 9.2l-4.2 4.3"/></svg>
      <span id="x-handle"></span>
    </a>
  </main>

  <!-- work: scroll-driven stack that bursts into a field. see work.js -->
  <section id="work" class="work" aria-label="Work">
    <div class="work-rails" aria-hidden="true"></div>
    <div class="work-stage">
      <div class="work-space"></div>
      <p class="work-word"></p>
      <p class="work-word"></p>
    </div>
  </section>

  <script src="config.js"></script>
  <script src="fountain.js"></script>
  <script src="main.js"></script>
  <script src="work.js"></script>
</body>
</html>
