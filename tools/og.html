<!doctype html>
<!-- the scene the link preview is filmed from: the title, the fountain running, and the
     byline on the right. 1200 x 630. time is stepped by hand (window.tick) so it can be
     captured one frame at a time; open it with ?live to watch it at normal speed. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Private Garden, link preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    #site { height: 630px; min-height: 0; }
    .garden { margin: 6px 0 34px; opacity: 1; }
    /* the whole title shows here, not the half cut one */
    .name { pointer-events: none; transform: translateY(.02em); }
    #site { padding-top: calc(var(--title, 12vw) * .98); }
    .ogby {
      position: absolute; left: 846px; font-family: var(--sans); font-size: 25px; line-height: 1.32; letter-spacing: .005em;
    }
    .ogby span { display: block; }
    .ogby b { font-weight: 600; }
    .ogby .hl-grad { animation: none !important; }
  </style>
  <script>
    // a clock that only moves when told to
    const LIVE = new URLSearchParams(location.search).has("live");
    let clock = 0, queue = [];
    if (!LIVE) {
      window.requestAnimationFrame = (fn) => { queue.push(fn); return queue.length; };
      window.cancelAnimationFrame = () => {};
    }
  </script>
</head>
<body class="live">
  <div class="grain" aria-hidden="true"></div>
  <div class="grain lite" aria-hidden="true"></div>
  <main id="site">
    <h1 id="name" class="name still instant set"></h1>
    <div class="garden">
      <svg id="fountain" viewBox="12 50 376 334" preserveAspectRatio="xMidYMax meet"></svg>
    </div>
    <p class="ogby" id="ogby"><span>A Collective by</span><b class="hl" id="me"><span>Nithin Aruswamy</span><span class="hl-grad" id="grad" aria-hidden="true">Nithin Aruswamy</span></b></p>
  </main>
  <script src="../fountain.js"></script>
  <script>
    const nameEl = document.getElementById("name"), site = document.getElementById("site");
    for (const c of "Private Garden") {
      const s = document.createElement("span");
      if (c === " ") s.className = "sp"; else { s.className = "ch"; s.innerHTML = `<span class="b">${c}</span>`; }
      nameEl.appendChild(s);
    }
    document.fonts.ready.then(() => {
      const chs = nameEl.querySelectorAll(".ch");
      const w = chs[chs.length - 1].getBoundingClientRect().right - chs[0].getBoundingClientRect().left;
      const size = (parseFloat(getComputedStyle(nameEl).fontSize) * 1200 * 0.94) / w;
      nameEl.style.fontSize = size + "px";
      site.style.setProperty("--title", size + "px");
      // the byline sits where the three lines sit on the page: centred 48 units below the middle rim
      const g = document.querySelector(".garden").getBoundingClientRect(), by = document.getElementById("ogby");
      const sc = Math.min(g.width / 376, g.height / 334);
      by.style.top = g.top + (g.height - 334 * sc) + (150 + 48 - 50) * sc - by.offsetHeight / 2 + "px";
      Fountain.start(document.getElementById("fountain"));
      window.ready = true;
    });

    // the colour band crosses the name at these seconds of the clip
    const SWEEPS = [2.4, 7.0], DUR = 0.95, grad = document.getElementById("grad");
    const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    window.clip = (s) => {
      let on = false;
      for (const at of SWEEPS) {
        const k = (s - at) / DUR;
        if (k >= 0 && k <= 1) { on = true; grad.style.opacity = 0.94; grad.style.backgroundPosition = (100 - 100 * ease(k)) + "% 0"; }
      }
      if (!on) grad.style.opacity = 0;
    };
    // move the fountain on by ms
    window.tick = (ms) => { clock += ms; const q = queue; queue = []; q.forEach((fn) => fn(clock)); };
    if (LIVE) { const t0 = performance.now(); const loop = (n) => { clip(((n - t0) / 1000) % 10); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  </script>
</body>
</html>
